services:
  - type: web
    name: internship-roadmap-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: internship-roadmap-db
          property: connectionString

databases:
  - name: internship-roadmap-db
    plan: free
