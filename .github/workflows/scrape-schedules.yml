name: Update Internship Schedules

on:
  schedule:
    # Runs every Monday at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run HENNGE & Mercari schedule scraper
        run: node scripts/scrape-schedules.mjs
      - name: Commit updated schedule JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/live-schedules.json
          git diff --staged --quiet || git commit -m "chore: update HENNGE & Mercari live schedules"
          git push
